name: CI

# PR validation and main-branch health checks for the contractor template.
# Scope: frozen pnpm install, full build, and the core create-contractor-site
# smoke suite. Optional image tooling stays local and is never invoked here.
on:
  push:
    branches:
      - main
  pull_request:

# Least privilege: the checks only need to read the repository.
permissions:
  contents: read

# Supersede in-flight runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Install, build, and CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # persist-credentials: false keeps the read-only token out of .git/config;
      # no step in this workflow needs to push.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm must be installed before Node setup so pnpm remains the only
      # package manager available to every later step.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.18.0'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Full core suite including the temp-target scaffold E2E. Capsule runtime
      # tests are gated out because the optional capsule is not installed in CI;
      # the default local run still exercises the complete suite.
      - name: Core CLI smoke (no capsule runtime)
        run: SKIP_CAPSULE_TESTS=1 pnpm run test:cli